[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartusbhub"
version = "1.2.1"
authors = [
  { name="zhang", email="mixedsignallab@outlook.com" },
]
description = "A Python library for SmartUSBHub that provides per-port power and data control, voltage and current monitoring, and manual plug/unplug simulation—designed for development, testing, and device management."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }

dependencies = [
    "pyserial",
]

[project.optional-dependencies]
# Packages used to run the test suite.
test = [
    "pytest",
    "pytest-html",
    "pytest-cov",
]

[project.urls]
Homepage = "https://www.mixedsignallab.com"
Repository = "https://github.com/mixedsignal-labs/smartusbhub"
Issues = "https://github.com/mixedsignal-labs/smartusbhub/issues"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "NOTICE"]
py-modules = ["smartusbhub"]
