<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">SmartUSBHub Pro 7CH USB2.0 system block diagram</title>
  <desc id="desc">Seven-port USB 2.0 hub showing the 19 V adapter power path, USB-C backup power path, per-port VBUS switches, USB2 data switches, and seven Type-A ports.</desc>
  <defs>
    <style>
      .background{fill:#fff}.boundary{fill:none;stroke:#d7d9dc;stroke-width:1}
      .box{fill:#fff;stroke:#222;stroke-width:1.3}.minor{fill:#fafafa;stroke:#222;stroke-width:.8}
      .major{fill:none;stroke:#222;stroke-width:1.2;stroke-linecap:square;stroke-linejoin:miter}
      .power{fill:none;stroke:#222;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
      .wire{fill:none;stroke:#8a8f94;stroke-width:.75;stroke-linecap:square}
      .control{fill:none;stroke:#8a8f94;stroke-width:1;stroke-linecap:square;stroke-linejoin:miter}
      text{fill:#222;font-family:"Source Sans 3",sans-serif;font-size:13px;font-weight:400}
      .heading{font-size:14px;font-weight:500}.small{fill:#8a8f94;font-size:11px}
      .tiny{fill:#555;font-size:9px}.switch-text{font-size:8px;font-weight:500}.body{font-size:13px;font-weight:500}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#222"/>
    </marker>
  </defs>

  <rect class="background" width="1200" height="780"/>
  <rect class="boundary" x="130" y="30" width="1040" height="720"/>
  <text class="heading" x="150" y="58">SMARTUSBHUB PRO 7CH USB2.0</text>

  <!-- Interfaces and logic -->
  <rect class="box" x="20" y="100" width="100" height="58"/>
  <text class="body" x="70" y="125" text-anchor="middle">COMMAND</text>
  <text class="small" x="70" y="146" text-anchor="middle">USB-CDC</text>
  <rect class="box" x="350" y="90" width="190" height="78"/>
  <text class="heading" x="445" y="123" text-anchor="middle">MCU / PORT CTRL</text>
  <text class="small" x="445" y="147" text-anchor="middle">Per-Port Control</text>
  <path class="major" d="M120 110H350"/>

  <rect class="box" x="20" y="400" width="100" height="58"/>
  <text class="body" x="70" y="420" text-anchor="middle">UPSTREAM</text>
  <text class="body" x="70" y="437" text-anchor="middle">DATA</text>
  <text class="small" x="70" y="453" text-anchor="middle">Type-C</text>
  <rect class="box" x="390" y="375" width="170" height="100"/>
  <text class="heading" x="475" y="420" text-anchor="middle">7-PORT USB2 HUB</text>
  <path class="major" d="M120 410H390"/>
  <path class="major" d="M560 425H620"/>

  <rect class="box" x="620" y="190" width="90" height="490"/>
  <text class="heading" x="665" y="435" text-anchor="middle" transform="rotate(-90 665 435)">7× DOWNSTREAM PORTS</text>

  <!-- Control paths are kept separate from the power-current path -->
  <text class="small" x="705" y="93" text-anchor="middle">POWER CONTROL ×7</text>
  <path class="control" d="M425 90V78H800V155"/>
  <text class="small" x="840" y="73" text-anchor="middle">USB2 CONTROL ×7</text>
  <path class="control" d="M470 90V58H930V155"/>

  <!-- USB-C backup power path -->
  <path class="power" d="M120 139H165" marker-end="url(#arrow)"/>
  <rect class="minor" x="165" y="120" width="170" height="38"/>
  <text class="tiny" x="250" y="136" text-anchor="middle">POWER ORING INPUT</text>
  <text class="tiny" x="250" y="151" text-anchor="middle">CMD VBUS · 5 V</text>

  <path class="power" d="M120 449H165" marker-end="url(#arrow)"/>
  <rect class="minor" x="165" y="430" width="170" height="38"/>
  <text class="tiny" x="250" y="446" text-anchor="middle">POWER ORING INPUT</text>
  <text class="tiny" x="250" y="461" text-anchor="middle">UPSTREAM VBUS · 5 V</text>

  <path class="power" d="M335 139H345V449H335M345 294H390" marker-end="url(#arrow)"/>
  <circle cx="345" cy="294" r="3.5" fill="#222"/>
  <rect class="minor" x="390" y="275" width="170" height="38"/>
  <text class="tiny" x="475" y="291" text-anchor="middle">USB-C BACKUP PATH</text>
  <text class="tiny" x="475" y="306" text-anchor="middle">≤ 1 A TOTAL</text>

  <!-- Main adapter power path -->
  <rect class="box" x="20" y="620" width="100" height="58"/>
  <text class="body" x="70" y="645" text-anchor="middle">DC 19 V</text>
  <text class="small" x="70" y="666" text-anchor="middle">POWER INPUT</text>
  <path class="power" d="M120 649H150" marker-end="url(#arrow)"/>
  <rect class="minor" x="150" y="630" width="100" height="38"/>
  <text class="tiny" x="200" y="646" text-anchor="middle">INPUT FUSE</text>
  <text class="tiny" x="200" y="661" text-anchor="middle">10 A</text>
  <path class="power" d="M250 649H280" marker-end="url(#arrow)"/>
  <rect class="box" x="280" y="615" width="230" height="68"/>
  <text class="heading" x="395" y="641" text-anchor="middle">DUAL POWER REGULATION</text>
  <text class="small" x="395" y="660" text-anchor="middle">19 V → 5.11 V · PH1 / PH2</text>
  <text class="tiny" x="395" y="676" text-anchor="middle">4 ports + 3 ports</text>

  <!-- Common 5 V distribution: straight into the power switch -->
  <path class="power" d="M560 294H590M510 649H590V431C580 431 580 419 590 419V185H745" marker-end="url(#arrow)"/>
  <circle cx="590" cy="294" r="3.5" fill="#222"/>
  <text class="heading" x="665" y="177" text-anchor="middle">5 V POWER DISTRIBUTION</text>

  <!-- Per-port switches -->
  <rect class="minor" x="745" y="155" width="110" height="40"/>
  <text class="heading" x="800" y="168" text-anchor="middle"><tspan x="800">POWER / LIMIT</tspan><tspan x="800" dy="15">SWITCH ×7</tspan></text>
  <rect class="minor" x="875" y="155" width="110" height="40"/>
  <text class="heading" x="930" y="168" text-anchor="middle"><tspan x="930">USB2 DATA</tspan><tspan x="930" dy="15">SWITCH ×7</tspan></text>
  <text class="heading" x="1070" y="168" text-anchor="middle"><tspan x="1070">TYPE-A</tspan><tspan x="1070" dy="15">PORT</tspan></text>
  <path class="control" d="M800 195V638"/>
  <path class="control" d="M930 195V638"/>

  <!-- Seven downstream rows; only the actual USB2 and VBUS paths are drawn -->
  <g>
    <line class="wire" x1="710" y1="223" x2="750" y2="223"/><rect class="minor" x="750" y="215" width="100" height="16"/><text class="switch-text" x="800" y="226" text-anchor="middle">VBUS</text><line class="wire" x1="850" y1="223" x2="1010" y2="223"/>
    <line class="wire" x1="710" y1="249" x2="880" y2="249"/><rect class="minor" x="880" y="241" width="100" height="16"/><text class="switch-text" x="930" y="252" text-anchor="middle">USB2</text><line class="wire" x1="980" y1="249" x2="1010" y2="249"/>
    <rect class="box" x="1010" y="210" width="120" height="52"/><text class="body" x="1070" y="241" text-anchor="middle">P1</text>
  </g>
  <g>
    <line class="wire" x1="710" y1="288" x2="750" y2="288"/><rect class="minor" x="750" y="280" width="100" height="16"/><text class="switch-text" x="800" y="291" text-anchor="middle">VBUS</text><line class="wire" x1="850" y1="288" x2="1010" y2="288"/>
    <line class="wire" x1="710" y1="314" x2="880" y2="314"/><rect class="minor" x="880" y="306" width="100" height="16"/><text class="switch-text" x="930" y="317" text-anchor="middle">USB2</text><line class="wire" x1="980" y1="314" x2="1010" y2="314"/>
    <rect class="box" x="1010" y="275" width="120" height="52"/><text class="body" x="1070" y="306" text-anchor="middle">P2</text>
  </g>
  <g>
    <line class="wire" x1="710" y1="353" x2="750" y2="353"/><rect class="minor" x="750" y="345" width="100" height="16"/><text class="switch-text" x="800" y="356" text-anchor="middle">VBUS</text><line class="wire" x1="850" y1="353" x2="1010" y2="353"/>
    <line class="wire" x1="710" y1="379" x2="880" y2="379"/><rect class="minor" x="880" y="371" width="100" height="16"/><text class="switch-text" x="930" y="382" text-anchor="middle">USB2</text><line class="wire" x1="980" y1="379" x2="1010" y2="379"/>
    <rect class="box" x="1010" y="340" width="120" height="52"/><text class="body" x="1070" y="371" text-anchor="middle">P3</text>
  </g>
  <g>
    <line class="wire" x1="710" y1="418" x2="750" y2="418"/><rect class="minor" x="750" y="410" width="100" height="16"/><text class="switch-text" x="800" y="421" text-anchor="middle">VBUS</text><line class="wire" x1="850" y1="418" x2="1010" y2="418"/>
    <line class="wire" x1="710" y1="444" x2="880" y2="444"/><rect class="minor" x="880" y="436" width="100" height="16"/><text class="switch-text" x="930" y="447" text-anchor="middle">USB2</text><line class="wire" x1="980" y1="444" x2="1010" y2="444"/>
    <rect class="box" x="1010" y="405" width="120" height="52"/><text class="body" x="1070" y="436" text-anchor="middle">P4</text>
  </g>
  <g>
    <line class="wire" x1="710" y1="483" x2="750" y2="483"/><rect class="minor" x="750" y="475" width="100" height="16"/><text class="switch-text" x="800" y="486" text-anchor="middle">VBUS</text><line class="wire" x1="850" y1="483" x2="1010" y2="483"/>
    <line class="wire" x1="710" y1="509" x2="880" y2="509"/><rect class="minor" x="880" y="501" width="100" height="16"/><text class="switch-text" x="930" y="512" text-anchor="middle">USB2</text><line class="wire" x1="980" y1="509" x2="1010" y2="509"/>
    <rect class="box" x="1010" y="470" width="120" height="52"/><text class="body" x="1070" y="501" text-anchor="middle">P5</text>
  </g>
  <g>
    <line class="wire" x1="710" y1="548" x2="750" y2="548"/><rect class="minor" x="750" y="540" width="100" height="16"/><text class="switch-text" x="800" y="551" text-anchor="middle">VBUS</text><line class="wire" x1="850" y1="548" x2="1010" y2="548"/>
    <line class="wire" x1="710" y1="574" x2="880" y2="574"/><rect class="minor" x="880" y="566" width="100" height="16"/><text class="switch-text" x="930" y="577" text-anchor="middle">USB2</text><line class="wire" x1="980" y1="574" x2="1010" y2="574"/>
    <rect class="box" x="1010" y="535" width="120" height="52"/><text class="body" x="1070" y="566" text-anchor="middle">P6</text>
  </g>
  <g>
    <line class="wire" x1="710" y1="613" x2="750" y2="613"/><rect class="minor" x="750" y="605" width="100" height="16"/><text class="switch-text" x="800" y="616" text-anchor="middle">VBUS</text><line class="wire" x1="850" y1="613" x2="1010" y2="613"/>
    <line class="wire" x1="710" y1="639" x2="880" y2="639"/><rect class="minor" x="880" y="631" width="100" height="16"/><text class="switch-text" x="930" y="642" text-anchor="middle">USB2</text><line class="wire" x1="980" y1="639" x2="1010" y2="639"/>
    <rect class="box" x="1010" y="600" width="120" height="52"/><text class="body" x="1070" y="631" text-anchor="middle">P7</text>
  </g>

  <rect x="650" y="697" width="480" height="38" fill="#fff" stroke="#8a8f94" stroke-width=".75"/>
  <text class="tiny" x="665" y="713">DC mode: 7 × 1.5 A typical (BC 1.2); each port protection limit ≈ 2.1 A.</text>
  <text class="tiny" x="665" y="728">USB-C backup mode: ≤ 1 A total for low-power downstream devices.</text>
</svg>
