<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      text{font-family:"Source Sans 3",sans-serif;fill:#282828}
      .t{font-size:22px}.m{font-size:20px}.s{font-size:16px;fill:#858b90}.xs{font-size:13px;fill:#555}
      .box{fill:#fff;stroke:#282828;stroke-width:1.8}
      .minor{fill:#fafafa;stroke:#282828;stroke-width:1.3}
      .line{fill:none;stroke:#303030;stroke-width:1.8}
      .thin{fill:none;stroke:#8b9297;stroke-width:1.3}
      .power{fill:none;stroke:#303030;stroke-width:2.4}
      .dash{fill:none;stroke:#777;stroke-width:1.2;stroke-dasharray:5 4}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#303030"/>
    </marker>
  </defs>

  <rect x="195" y="45" width="1560" height="885" fill="#fff" stroke="#d6dade" stroke-width="1.5"/>
  <text x="225" y="88" class="t">SMARTUSBHUB PRO 4CH USB2.0</text>

  <!-- Original interface blocks -->
  <rect x="30" y="165" width="150" height="87" class="box"/>
  <text x="105" y="202" text-anchor="middle" class="m">COMMAND</text>
  <text x="105" y="234" text-anchor="middle" class="s">USB-CDC</text>

  <rect x="30" y="450" width="150" height="87" class="box"/>
  <text x="105" y="482" text-anchor="middle" class="m">UPSTREAM</text>
  <text x="105" y="508" text-anchor="middle" class="m">DATA</text>
  <text x="105" y="530" text-anchor="middle" class="s">Type-C</text>

  <rect x="30" y="646" width="150" height="87" class="box"/>
  <text x="105" y="684" text-anchor="middle" class="m">AUX Type-C</text>
  <text x="105" y="716" text-anchor="middle" class="s">POWER INPUT</text>

  <!-- Original logic/data blocks -->
  <rect x="525" y="150" width="285" height="118" class="box"/>
  <text x="668" y="203" text-anchor="middle" class="t">MCU / PORT CTRL</text>
  <text x="668" y="236" text-anchor="middle" class="s">Per-Port Control</text>
  <path d="M180 190H525" class="line"/>

  <rect x="585" y="418" width="255" height="150" class="box"/>
  <text x="713" y="497" text-anchor="middle" class="t">4-PORT USB2 HUB</text>
  <path d="M180 493H585" class="line"/>

  <rect x="930" y="300" width="135" height="450" class="box"/>
  <text x="998" y="535" text-anchor="middle" class="t" transform="rotate(-90 998 535)">4× DOWNSTREAM PORTS</text>
  <path d="M840 493H930" class="line"/>

  <text x="900" y="125" class="s">POWER CONTROL ×4</text>
  <path d="M650 150V130H1200V247" class="thin"/>
  <text x="1098" y="105" class="s">USB2 CONTROL ×4</text>
  <path d="M720 150V110H1395V247" class="thin"/>

  <rect x="1117" y="247" width="166" height="61" class="minor"/>
  <text x="1200" y="272" text-anchor="middle" class="m">POWER</text>
  <text x="1200" y="296" text-anchor="middle" class="m">SWITCH</text>
  <rect x="1312" y="247" width="166" height="61" class="minor"/>
  <text x="1395" y="272" text-anchor="middle" class="m">USB2 DATA</text>
  <text x="1395" y="296" text-anchor="middle" class="m">SWITCH</text>

  <!-- Four original downstream rows -->
  <text x="1605" y="266" text-anchor="middle" class="m">TYPE-A</text>
  <text x="1605" y="290" text-anchor="middle" class="m">PORT</text>
  <path d="M1065 349H1515M1065 388H1515" class="thin"/>
  <path d="M1065 454H1515M1065 493H1515" class="thin"/>
  <path d="M1065 559H1515M1065 598H1515" class="thin"/>
  <path d="M1065 664H1515M1065 703H1515" class="thin"/>
  <path d="M1200 308V664" class="thin"/>
  <path d="M1395 308V703" class="thin"/>

  <rect x="1125" y="337" width="150" height="25" class="minor"/><text x="1200" y="354" text-anchor="middle" class="xs">VBUS</text>
  <rect x="1320" y="376" width="150" height="25" class="minor"/><text x="1395" y="393" text-anchor="middle" class="xs">USB2</text>
  <rect x="1125" y="442" width="150" height="25" class="minor"/><text x="1200" y="459" text-anchor="middle" class="xs">VBUS</text>
  <rect x="1320" y="481" width="150" height="25" class="minor"/><text x="1395" y="498" text-anchor="middle" class="xs">USB2</text>
  <rect x="1125" y="547" width="150" height="25" class="minor"/><text x="1200" y="564" text-anchor="middle" class="xs">VBUS</text>
  <rect x="1320" y="586" width="150" height="25" class="minor"/><text x="1395" y="603" text-anchor="middle" class="xs">USB2</text>
  <rect x="1125" y="652" width="150" height="25" class="minor"/><text x="1200" y="669" text-anchor="middle" class="xs">VBUS</text>
  <rect x="1320" y="691" width="150" height="25" class="minor"/><text x="1395" y="708" text-anchor="middle" class="xs">USB2</text>

  <rect x="1515" y="330" width="180" height="78" class="box"/><text x="1605" y="377" text-anchor="middle" class="m">P1</text>
  <rect x="1515" y="435" width="180" height="78" class="box"/><text x="1605" y="482" text-anchor="middle" class="m">P2</text>
  <rect x="1515" y="540" width="180" height="78" class="box"/><text x="1605" y="587" text-anchor="middle" class="m">P3</text>
  <rect x="1515" y="645" width="180" height="78" class="box"/><text x="1605" y="692" text-anchor="middle" class="m">P4</text>

  <!-- Added power paths, kept in the original monochrome drawing language -->
  <text x="225" y="308" class="s">5 V POWER INPUT PATHS</text>

  <path d="M180 472H285" class="power" marker-end="url(#arrow)"/>
  <rect x="285" y="446" width="190" height="52" class="minor"/>
  <text x="380" y="468" text-anchor="middle" class="xs">ONE-WAY DIODE</text>
  <text x="380" y="487" text-anchor="middle" class="xs">+ 4 A FUSE</text>

  <path d="M180 230H285" class="power" marker-end="url(#arrow)"/>
  <rect x="285" y="204" width="190" height="52" class="minor"/>
  <text x="380" y="226" text-anchor="middle" class="xs">ONE-WAY DIODE</text>
  <text x="380" y="245" text-anchor="middle" class="xs">+ 4 A FUSE</text>

  <path d="M180 690H285" class="power" marker-end="url(#arrow)"/>
  <rect x="285" y="664" width="190" height="52" class="minor"/>
  <text x="380" y="686" text-anchor="middle" class="xs">DIRECT · NO PROTECTION</text>
  <text x="380" y="705" text-anchor="middle" class="xs">MAX 5 A · Type-C connector</text>

  <path d="M475 230H510V690M475 472H510M475 690H510" class="power"/>
  <circle cx="510" cy="278" r="5" fill="#303030"/>
  <circle cx="510" cy="472" r="5" fill="#303030"/>
  <text x="958" y="242" text-anchor="middle" class="m">COMMON 5 V BUS</text>
  <text x="958" y="264" text-anchor="middle" class="xs">I TOTAL = I UP + I CMD + I AUX</text>
  <path d="M510 278H1117" class="power" marker-end="url(#arrow)"/>

  <rect x="1120" y="797" width="575" height="86" fill="#fff" stroke="#8b9297" stroke-width="1.2"/>
  <text x="1140" y="824" class="xs">UPSTREAM: one-way diode + 4 A fuse</text>
  <text x="1140" y="846" class="xs">CMD: one-way diode + 4 A fuse</text>
  <text x="1140" y="868" class="xs">AUX: no onboard protection; 5 A maximum (Type-C connector rating).</text>
  <text x="225" y="905" class="s">Total available output current depends on all connected sources, cables, connectors and protection paths.</text>
</svg>
