[pytest]
# Pytest configuration for SmartUSBHub tests
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -s
    --tb=short
    --strict-markers
    --log-cli-level=INFO
markers =
    unit: marks offline unit tests that do not require hardware
    protocol: marks offline protocol/framing tests that do not require hardware
    slow: marks tests as slow (deselect with '-m "not slow"')
    hardware: marks tests that require hardware (deselect with '-m "not hardware"')
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(message)s
log_cli_date_format = %H:%M:%S
